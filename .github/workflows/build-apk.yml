name: Build APK

# 云端出 Android release APK，不需要本机装 JDK / Android SDK。
# 触发方式：
#   1. 手动：仓库 Actions 页 → Build APK → Run workflow
#   2. 打 tag：git tag v1.0.0 && git push --tags
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # 兜底：任何一步卡住都不会一直挂到 GitHub 默认的 6 小时上限
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: 生成 android 平台目录
        # 仓库里只提交了 lib/ 等业务代码，android/ 是按需生成的。
        run: flutter create --platforms=android --org com.idphoto --project-name id_photo_maker .

      - name: 拉取依赖
        run: flutter pub get

      - name: 写入相册 / 相机权限声明
        run: python3 tool/patch_platforms.py

      # 静态检查与单测不阻塞出包，但失败会在 Actions 里标出 annotation。
      # 这样做是为了「即使有一项测试红了，你仍然能拿到 APK 去装」。
      - name: 静态检查
        continue-on-error: true
        run: flutter analyze

      - name: 单元测试
        continue-on-error: true
        timeout-minutes: 10
        run: flutter test --reporter expanded

      - name: 构建通用 release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: id-photo-maker-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 输出体积信息
        run: ls -lh build/app/outputs/flutter-apk/
